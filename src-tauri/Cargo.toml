[package]
name = "nanooffice"
version = "0.1.0"
description = "NanoOffice — Rust + Tauri shell around the ONLYOFFICE editing engine"
authors = ["NanoOffice contributors"]
edition = "2021"

[lib]
name = "nanooffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Track A A2 slice (T-A20): 1 member — chỉ để các gate sẵn có (check/fmt/
# clippy/test/license) phủ crate; kiến trúc vẫn 1 crate 1 mục đích (DD K01 §3).
[workspace]
members = ["crates/nanooffice-ooxml"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11.11"
base64 = "0.23.1"
# Track A A2 (T-A24): the OOXML crate in the runtime open path (adapter in
# sidecar::convert) — workspace-member-only (gates) until parity, T-A23.
nanooffice-ooxml = { path = "crates/nanooffice-ooxml" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
