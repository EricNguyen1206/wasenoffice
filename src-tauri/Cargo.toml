[package]
name = "nanooffice"
version = "0.1.0"
description = "NanoOffice — Rust + Tauri shell around the ONLYOFFICE editing engine"
authors = ["NanoOffice contributors"]
edition = "2021"

[lib]
name = "nanooffice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11.11"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
