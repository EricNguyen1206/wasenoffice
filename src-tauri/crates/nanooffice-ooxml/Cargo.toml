[package]
name = "nanooffice-ooxml"
version = "0.1.0"
description = "NanoOffice OOXML core (Track A rung A2) — spec-first docx read/write (ECMA-376)"
authors = ["NanoOffice contributors"]
edition = "2021"
license = "MIT"
publish = false

[dependencies]
quick-xml = "0.31"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
