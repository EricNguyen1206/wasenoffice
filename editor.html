<!doctype html>
<html lang="en" class="h-full overflow-hidden bg-paper">
  <head>
    <meta charset="UTF-8" />
    <title>WasenOffice — Nano Light</title>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="m-0 flex h-full flex-col overflow-hidden bg-paper">
    <!-- L01 round-1 chrome: name + dirty dot + Save (Cmd-S). Canvas keeps the
         UA-default typography the viewer was pixel-baselined on (T-058 trap:
         canvas fillText follows document font smoothing). -->
    <header class="flex shrink-0 flex-col border-b border-edge bg-panel">
      <!-- Multi-document Tab Bar (T-A37) -->
      <nav id="tab-bar" class="flex items-center gap-1 overflow-x-auto border-b border-edge/50 px-2 pt-1 text-xs select-none"></nav>
      <!-- Document metadata & Save button -->
      <div class="flex items-center gap-3 px-4 py-1.5">
        <img src="/logo.png" alt="WasenOffice" class="h-4 w-4 rounded object-contain" />
        <span id="doc-name" class="truncate text-[0.85em] font-medium text-fg"></span>
        <span id="dirty-dot" class="hidden h-2 w-2 shrink-0 rounded-full bg-accent"></span>
        <span class="flex-1"></span>
        <button
          id="save-btn"
          class="cursor-pointer rounded-panel border border-edge bg-panel px-[1.1em] py-[0.35em] text-[0.8em] font-medium text-fg shadow-sm outline-none hover:bg-panel-active active:bg-panel-active disabled:opacity-50"
        >
          Save
        </button>
      </div>
    </header>
    <main id="canvas-box" class="flex-1 overflow-auto relative">
      <div id="format-toolbar" class="hidden absolute z-20 flex items-center gap-1 rounded-panel border border-edge bg-panel px-1.5 py-1 shadow-md text-fg text-xs select-none">
        <button id="fmt-bold" type="button" class="cursor-pointer rounded px-2 py-0.5 font-bold hover:bg-panel-active active:bg-panel-active" title="Bold (Cmd-B)">B</button>
        <button id="fmt-italic" type="button" class="cursor-pointer rounded px-2 py-0.5 italic hover:bg-panel-active active:bg-panel-active" title="Italic (Cmd-I)">I</button>
        <button id="fmt-underline" type="button" class="cursor-pointer rounded px-2 py-0.5 underline hover:bg-panel-active active:bg-panel-active" title="Underline (Cmd-U)">U</button>
      </div>
      <canvas id="cv" class="block"></canvas>
    </main>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
